
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | NeonPlay</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <a class="brand" href="/">NEON<span>PLAY</span></a>
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Sign In</h1>
    <p class="subtitle">Ready to play? Sign in to continue.</p>

    <form id="signin-form">
      <label for="signin-email">Email address</label>
      <input id="signin-email" name="email" type="email"
             placeholder="you@example.com" required autocomplete="email">

      <label for="signin-password">Password</label>
      <input id="signin-password" name="password" type="password"
             placeholder="Enter your password" required
             autocomplete="current-password">

      <button type="submit">Sign In →</button>
      <p id="auth-message" role="status"></p>
    </form>

    <p class="switch-page">
      New to NeonPlay? <a href="/signup.html">Create an account</a>
    </p>
  </main>
</body>
</html>
